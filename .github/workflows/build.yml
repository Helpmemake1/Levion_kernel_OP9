name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: nethunterv2

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev git zip gcc-aarch64-linux-gnu

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/Panchajanya1999/azure-clang.git "$HOME/clang"

      - name: Restore CAN ISO-TP Module
        run: |
          rm -rf drivers/net/can/can-isotp
          mkdir -p drivers/net/can/can-isotp
          git clone --depth=1 https://github.com/hartkopp/can-isotp.git drivers/net/can/can-isotp
          if [ ! -f "drivers/net/can/can-isotp/Kconfig" ]; then
            echo 'config CAN_ISOTP' > drivers/net/can/can-isotp/Kconfig
            echo '  tristate "ISO 15765-2 CAN transport protocol"' >> drivers/net/can/can-isotp/Kconfig
            echo '  depends on CAN' >> drivers/net/can/can-isotp/Kconfig
            echo '  help' >> drivers/net/can/can-isotp/Kconfig
            echo '    CAN ISO 15765-2 Transport Protocol (ISO-TP)' >> drivers/net/can/can-isotp/Kconfig
          fi

      - name: Patch Baseband Guard Check & Defconfig
        run: |
          mkdir -p out
          export PATH="$HOME/clang/bin:$PATH"
          
          # Disable strict error aborts in Baseband-guard Makefile
          sed -i 's/$(error Please follow Baseband-guard.*/# Bypassed BBG check/g' security/baseband-guard/Makefile || true
          sed -i 's/$(error BBG not enable in CONFIG_LSM.*/# Bypassed LSM check/g' security/baseband-guard/Makefile || true
          
          # Generate base config
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-gki_defconfig
          
          # Disable KernelSU (for Magisk) and configure LSM
          scripts/config --file out/.config --disable CONFIG_KSU
          scripts/config --file out/.config --set-str CONFIG_LSM "lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,bbg"

      - name: Compile Kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          
          # Pass KCFLAGS to suppress treating C99 declaration warnings as fatal errors
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-declaration-after-statement -Wno-error"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          cp out/arch/arm64/boot/Image AnyKernel/ || cp out/arch/arm64/boot/Image.gz AnyKernel/ || cp out/arch/arm64/boot/Image.lz4 AnyKernel/
          cd AnyKernel
          zip -r9 ../Levion-NetHunter-MT7610U.zip * -x .git\* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Levion-NetHunter-Kernel
          path: Levion-NetHunter-MT7610U.zip
          
