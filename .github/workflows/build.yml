name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: nethunterv2

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev git zip gcc-aarch64-linux-gnu erofs-utils e2fsprogs

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/Panchajanya1999/azure-clang.git "$HOME/clang"

      - name: Restore CAN ISO-TP Module
        run: |
          rm -rf drivers/net/can/can-isotp
          mkdir -p drivers/net/can/can-isotp
          git clone --depth=1 https://github.com/hartkopp/can-isotp.git drivers/net/can/can-isotp
          if [ ! -f "drivers/net/can/can-isotp/Kconfig" ]; then
            echo 'config CAN_ISOTP' > drivers/net/can/can-isotp/Kconfig
            echo '  tristate "ISO 15765-2 CAN transport protocol"' >> drivers/net/can/can-isotp/Kconfig
            echo '  depends on CAN' >> drivers/net/can/can-isotp/Kconfig
            echo '  help' >> drivers/net/can/can-isotp/Kconfig
            echo '    CAN ISO 15765-2 Transport Protocol (ISO-TP)' >> drivers/net/can/can-isotp/Kconfig
          fi

      - name: Setup Defconfig & Disable BBG
        run: |
          mkdir -p out
          export PATH="$HOME/clang/bin:$PATH"
          
          # Disable CONFIG_BBG in source defconfigs
          sed -i 's/CONFIG_BBG=y/CONFIG_BBG=n/g' arch/arm64/configs/vendor/lahaina-gki_defconfig || true
          
          # Generate base config
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-gki_defconfig
          
          # Explicitly disable BBG and KernelSU (for Magisk)
          scripts/config --file out/.config --disable CONFIG_BBG
          scripts/config --file out/.config --disable CONFIG_KSU

      - name: Compile Kernel & Install Modules
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-declaration-after-statement -Wno-error" KBUILD_MODPOST_WARN=1
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH=../modules_out modules_install

      - name: Package Matched Kernel & vendor_dlkm.img
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          
          # Clean default placeholders
          rm -rf AnyKernel/ramdisk AnyKernel/patch AnyKernel/.git
          
          # 1. Locate existing anykernel.sh or write the OnePlus 9 script
          if [ -f "anykernel.sh" ]; then
            cp anykernel.sh AnyKernel/anykernel.sh
          else
            echo "### AnyKernel3 Ramdisk Mod Script" > AnyKernel/anykernel.sh
            echo "properties() { '" >> AnyKernel/anykernel.sh
            echo "kernel.string=### Levion Kernel for OnePlus 9/Pro ###" >> AnyKernel/anykernel.sh
            echo "do.devicecheck=1" >> AnyKernel/anykernel.sh
            echo "do.modules=0" >> AnyKernel/anykernel.sh
            echo "do.systemless=1" >> AnyKernel/anykernel.sh
            echo "do.cleanup=1" >> AnyKernel/anykernel.sh
            echo "do.cleanuponabort=0" >> AnyKernel/anykernel.sh
            echo "device.name1=OnePlus9Pro" >> AnyKernel/anykernel.sh
            echo "device.name2=lemonadep" >> AnyKernel/anykernel.sh
            echo "device.name3=OnePlus9ProTMO" >> AnyKernel/anykernel.sh
            echo "device.name4=lemonadept" >> AnyKernel/anykernel.sh
            echo "device.name5=OnePlus9" >> AnyKernel/anykernel.sh
            echo "device.name6=lemonade" >> AnyKernel/anykernel.sh
            echo "device.name7=OnePlus9TMO" >> AnyKernel/anykernel.sh
            echo "device.name8=lemonadet" >> AnyKernel/anykernel.sh
            echo "device.name9=OnePlus9VZW" >> AnyKernel/anykernel.sh
            echo "device.name10=lemonadev" >> AnyKernel/anykernel.sh
            echo "supported.versions=15-16" >> AnyKernel/anykernel.sh
            echo "'; }" >> AnyKernel/anykernel.sh
            echo "fstrim -v /data;" >> AnyKernel/anykernel.sh
            echo "boot_attributes() { set_perm_recursive 0 0 755 644 \$RAMDISK/overlay.d/*; set_perm_recursive 0 0 750 750 \$RAMDISK/overlay.d/sbin; }" >> AnyKernel/anykernel.sh
            echo "BLOCK=boot; IS_SLOT_DEVICE=1; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto; NO_VBMETA_PARTITION_PATCH=1;" >> AnyKernel/anykernel.sh
            echo ". tools/ak3-core.sh;" >> AnyKernel/anykernel.sh
            echo "dump_boot; write_boot;" >> AnyKernel/anykernel.sh
            echo "vendor_boot_attributes() { set_perm_recursive 0 0 755 644 \$RAMDISK/*; }" >> AnyKernel/anykernel.sh
            echo "BLOCK=vendor_boot; IS_SLOT_DEVICE=1; RAMDISK_COMPRESSION=auto; PATCH_VBMETA_FLAG=auto; NO_VBMETA_PARTITION_PATCH=1;" >> AnyKernel/anykernel.sh
            echo "reset_ak; dump_boot; write_boot;" >> AnyKernel/anykernel.sh
          fi

          # 2. Copy vendor_ramdisk, banner, and README if present
          if [ -d "vendor_ramdisk" ]; then cp -r vendor_ramdisk AnyKernel/; fi
          if [ -f "banner" ]; then cp banner AnyKernel/; fi
          if [ -f "README.md" ]; then cp README.md AnyKernel/; fi

          # 3. Copy matching kernel binary
          cp out/arch/arm64/boot/Image AnyKernel/Image
          
          # 4. Stage modules and strip debug symbols
          mkdir -p dlkm_staging/lib/modules
          find modules_out/ -name "*.ko" -exec cp {} dlkm_staging/lib/modules/ \;
          find dlkm_staging/ -name "*.ko" -exec "$HOME/clang/bin/llvm-strip" --strip-debug --strip-unneeded {} + || true
          
          # 5. Build EROFS vendor_dlkm.img with lz4hc compression
          mkfs.erofs -z lz4hc,9 AnyKernel/vendor_dlkm.img dlkm_staging/

      - name: Upload Flashable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Levion-NetHunter-MT7610U
          path: AnyKernel/
          
