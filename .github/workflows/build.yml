name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: nethunterv2

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev libelf-dev git zip gcc-aarch64-linux-gnu erofs-utils e2fsprogs

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://gitlab.com/Panchajanya1999/azure-clang.git "$HOME/clang"

      - name: Restore CAN ISO-TP Module
        run: |
          rm -rf drivers/net/can/can-isotp
          mkdir -p drivers/net/can/can-isotp
          git clone --depth=1 https://github.com/hartkopp/can-isotp.git drivers/net/can/can-isotp
          if [ ! -f "drivers/net/can/can-isotp/Kconfig" ]; then
            echo 'config CAN_ISOTP' > drivers/net/can/can-isotp/Kconfig
            echo '  tristate "ISO 15765-2 CAN transport protocol"' >> drivers/net/can/can-isotp/Kconfig
            echo '  depends on CAN' >> drivers/net/can/can-isotp/Kconfig
            echo '  help' >> drivers/net/can/can-isotp/Kconfig
            echo '    CAN ISO 15765-2 Transport Protocol (ISO-TP)' >> drivers/net/can/can-isotp/Kconfig
          fi

      - name: Setup Defconfig & Disable BBG
        run: |
          mkdir -p out
          export PATH="$HOME/clang/bin:$PATH"
          
          # Disable CONFIG_BBG in source defconfigs
          sed -i 's/CONFIG_BBG=y/CONFIG_BBG=n/g' arch/arm64/configs/vendor/lahaina-gki_defconfig || true
          
          # Generate base config
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 vendor/lahaina-gki_defconfig
          
          # Explicitly disable BBG and KernelSU (for Magisk)
          scripts/config --file out/.config --disable CONFIG_BBG
          scripts/config --file out/.config --disable CONFIG_KSU

      - name: Compile Kernel & Install Modules
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          
          # Compile kernel image and modules
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 KCFLAGS="-Wno-declaration-after-statement -Wno-error" KBUILD_MODPOST_WARN=1
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 INSTALL_MOD_PATH=../modules_out modules_install

      - name: Package AnyKernel3 with vendor_dlkm.img & vendor_ramdisk
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel
          
          # 1. Copy core kernel Image
          cp out/arch/arm64/boot/Image AnyKernel/
          
          # 2. Copy vendor_ramdisk if present in repo root or subdirectories
          if [ -d "vendor_ramdisk" ]; then
            cp -r vendor_ramdisk AnyKernel/
          elif [ -d "out/vendor_ramdisk" ]; then
            cp -r out/vendor_ramdisk AnyKernel/
          fi

          # 3. Build vendor_dlkm.img filesystem containing compiled .ko drivers
          mkdir -p dlkm_staging/lib/modules
          find modules_out/ -name "*.ko" -exec cp {} dlkm_staging/lib/modules/ \;
          
          # Create EROFS image (standard for Android 12+ GKI vendor_dlkm partitions)
          mkfs.erofs AnyKernel/vendor_dlkm.img dlkm_staging/
          
          # 4. Zip the flashable package
          cd AnyKernel
          zip -r9 ../Levion-NetHunter-MT7610U.zip * -x .git\* README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Levion-NetHunter-Kernel
          path: Levion-NetHunter-MT7610U.zip
          
